<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Money Makers</title>
  <link rel="stylesheet" href="ui.css" />
  <style>
    main { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
    .setup { width: 660px; max-width: 100%; background: var(--white); border: 1px solid var(--line); border-radius: 24px; padding: 36px 40px; display: flex; flex-direction: column; gap: 18px; }
    .setup.center { align-items: center; text-align: center; }
    .setup.center .lead { max-width: 520px; }
    .top { display: flex; align-items: center; gap: 14px; }
    .back-circle { width: 36px; height: 36px; border-radius: 18px; border: 1px solid var(--paper); background: none; display: grid; place-items: center; padding: 0; }
    .back-circle img { width: 18px; height: 18px; }
    .progress { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--seal); }
    .progress i { width: 28px; height: 6px; border-radius: 3px; background: var(--line); }
    .progress i.on { background: var(--blue); }
    .logo { width: 76px; height: 76px; }
    .how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; text-align: left; }
    .how div { background: var(--bill); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
    .how .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--blue-tint); display: grid; place-items: center; }
    .how .ic img { width: 22px; height: 22px; }
    .how b { font-size: 15px; }
    .how p { margin: 0; font-size: 13px; color: var(--seal); }
    .pick { display: flex; flex-direction: column; gap: 6px; }
    .nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .nav .right { display: flex; gap: 10px; align-items: center; }
    .text-back { display: inline-flex; align-items: center; gap: 6px; padding: 8px; border: 0; background: none; font-size: 15px; color: var(--seal); }
    .text-back img { width: 16px; height: 16px; }
    .text-back:hover { color: var(--ink); }
    .check-coin { width: 72px; height: 72px; border-radius: 36px; background: var(--blue); border: 6px solid var(--blue-tint); display: grid; place-items: center; }
    .check-coin img { width: 34px; height: 34px; }
    .goal-card { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 10px; }
    .goal-card .name { font-size: 28px; font-weight: 700; line-height: 1.18; }
    .goal-card .row { display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; }
    .tip { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--bill); font-size: 14px; text-align: left; }
    .tip .ic { width: 30px; height: 30px; border-radius: 9px; background: var(--blue-tint); display: grid; place-items: center; }
    .tip .ic img { width: 16px; height: 16px; }
    .setup .btn.wide { width: 100%; }
    /* S5: coach mark pointing at the toolbar, where the extension icon lives */
    .done-page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
    .done-page .ghost-title { font-size: 30px; font-weight: 700; color: var(--paper); }
    .done-page .search { width: 520px; max-width: calc(100% - 32px); height: 48px; border-radius: 24px; border: 1px solid var(--line); background: var(--white); display: flex; align-items: center; padding: 0 20px; color: var(--slate); }
    .coach { position: fixed; top: 10px; right: 16px; width: 310px; max-width: calc(100% - 32px); }
    .coach .pointer { width: 16px; height: 9px; margin: 0 22px 0 auto; }
    .coach .box { background: var(--blue); color: var(--white); border-radius: 16px; padding: 18px 18px 16px; box-shadow: 0 16px 40px rgba(26,31,41,.25); display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
    .coach b { align-self: stretch; font-size: 17px; }
    .coach p { margin: 0; align-self: stretch; font-size: 14px; }
    .coach button { border: 0; border-radius: 8px; background: var(--white); color: var(--ink); padding: 8px 16px; font-size: 14px; font-weight: 700; }
    @media (max-width: 600px) {
      .setup { padding: 28px 20px; }
      .how { grid-template-columns: 1fr; }
      .nav { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script src="shared.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
